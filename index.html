<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy - AI Learning</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-[#0b132b] text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center bg-[#0d1b2a]/60 backdrop-blur">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">✦</div>
      <h1 class="text-xl font-bold tracking-tight">Study Buddy <span class="text-xs text-indigo-400 font-normal ml-2">AI Learning</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <input id="apiKeyInput" type="password" placeholder="Gemini API Key" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
      <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-medium text-white transition">Save Key</button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Column: PDF Dropzone & Controls -->
    <div class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-[#1c2541]/70 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center text-center">
        <div class="w-16 h-16 rounded-full bg-indigo-950/80 border border-indigo-500/20 flex items-center justify-center mb-4 text-indigo-400">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <h3 class="font-semibold text-lg text-slate-200">Upload PDF</h3>
        <p class="text-xs text-slate-400 mt-1 mb-4">Ground answers, summaries & quizzes on your notes</p>

        <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-2 px-5 rounded-xl transition shadow-md shadow-indigo-600/30">
          Choose PDF
          <input id="pdfInput" type="file" accept="application/pdf" class="hidden" onchange="handleFileUpload(event)">
        </label>
        <span id="fileBadge" class="text-xs text-emerald-400 mt-3 hidden truncate max-w-full"></span>
      </div>

      <!-- Quick Action Buttons -->
      <div class="bg-[#1c2541]/40 border border-slate-800/80 rounded-2xl p-4 flex flex-col gap-2">
        <p class="text-xs font-semibold text-slate-400 mb-1">Quick Prompts</p>
        <button onclick="triggerQuickPrompt('Summarize the attached notes in clear structured points.')" class="w-full text-left bg-slate-900/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-2.5 text-xs text-slate-300 transition">📖 Summarize PDF</button>
        <button onclick="triggerQuickPrompt('Generate a 5-question multiple choice quiz on the topic.')" class="w-full text-left bg-slate-900/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-2.5 text-xs text-slate-300 transition">❓ Generate Quiz (5 MCQs)</button>
        <button onclick="triggerQuickPrompt('Explain the core concepts and fundamental principles in detail.')" class="w-full text-left bg-slate-900/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-2.5 text-xs text-slate-300 transition">📝 Explain Core Concepts</button>
      </div>
    </div>

    <!-- Right Column: Interactive Chat & Output -->
    <div class="lg:col-span-8 flex flex-col bg-[#1c2541]/50 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div id="chatHistory" class="flex-1 p-6 overflow-y-auto space-y-4 min-h-[420px] max-h-[550px]">
        <div class="flex gap-3">
          <div class="w-7 h-7 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300 text-xs font-bold">AI</div>
          <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-sm max-w-2xl text-slate-200">
            Hey! Ask any academic question, or upload a PDF to extract summaries, explanations, and practice quizzes.
          </div>
        </div>
      </div>

      <!-- Input Bar -->
      <div class="p-4 border-t border-slate-800 bg-[#0d1b2a]/40">
        <form onsubmit="handleSend(event)" class="relative flex items-center">
          <input id="promptInput" type="text" placeholder="Ask anything to start learning..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-4 pr-12 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="absolute right-2.5 w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shadow">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const HARDCODED_API_KEY = ""; 

    let extractedPdfText = "";
    let apiKey = HARDCODED_API_KEY || localStorage.getItem("gemini_key") || "";

    window.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("apiKeyInput");
      if (apiKey) {
        input.value = apiKey;
      }
    });

    function saveApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      if (val) {
        localStorage.setItem("gemini_key", val);
        apiKey = val;
        alert("API Key permanently saved in your browser!");
      }
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const badge = document.getElementById("fileBadge");
      badge.textContent = `Reading ${file.name}...`;
      badge.classList.remove("hidden");
      badge.classList.remove("text-rose-400");
      badge.classList.add("text-emerald-400");

      const reader = new FileReader();
      reader.onload = async function() {
        try {
          const typedarray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let fullText = "";

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += `\n--- Page ${i} ---\n` + pageText;
          }

          extractedPdfText = fullText;
          badge.textContent = `Attached: ${file.name} (${pdf.numPages} pages)`;
        } catch (err) {
          badge.textContent = "Error reading PDF file.";
          badge.classList.replace("text-emerald-400", "text-rose-400");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function triggerQuickPrompt(txt) {
      document.getElementById("promptInput").value = txt;
      handleSend(new Event('submit'));
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById("promptInput");
      const query = input.value.trim();
      if (!query) return;

      if (!apiKey) {
        apiKey = document.getElementById("apiKeyInput").value.trim();
        if (apiKey) {
          localStorage.setItem("gemini_key", apiKey);
        } else {
          alert("Pehle top right corner me Gemini API Key daal kar Save Key par click karo.");
          return;
        }
      }

      input.value = "";
      appendMessage("user", query);

      const loadingId = appendMessage("ai", '<div class="flex items-center gap-2"><span class="animate-spin text-indigo-400">✦</span> <span class="animate-pulse">Thinking & generating...</span></div>');

      try {
        const responseData = await callGemini(query, extractedPdfText);
        renderResponse(loadingId, responseData);
      } catch (err) {
        const errElem = document.getElementById(loadingId);
        if (errElem) {
          errElem.innerHTML = `
            <div class="text-rose-400">
              <p class="font-semibold mb-1">❌ Request Failed</p>
              <p class="text-xs text-rose-300/80">${err.message}</p>
              <p class="text-[11px] text-slate-400 mt-2">API key check karein ya hard refresh (Ctrl+F5) karein.</p>
            </div>
          `;
        }
      }
    }

    function appendMessage(role, content) {
      const id = "msg-" + Date.now();
      const isUser = role === "user";
      const html = `
        <div class="flex gap-3 ${isUser ? 'justify-end' : ''}">
          ${!isUser ? '<div class="w-7 h-7 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300 text-xs font-bold">AI</div>' : ''}
          <div id="${id}" class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900/80 border border-slate-800 text-slate-200'} rounded-2xl p-4 text-sm max-w-2xl leading-relaxed">
            ${content}
          </div>
        </div>`;
      const container = document.getElementById("chatHistory");
      container.insertAdjacentHTML("beforeend", html);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    // Live model detector to avoid 404 or outdated model strings
    async function resolveActiveFlashModel() {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = data.models || [];
          
          // Prioritize active flash models with free quota
          const priority = [
            "gemini-2.5-flash",
            "gemini-2.0-flash",
            "gemini-2.0-flash-lite",
            "gemini-1.5-flash-8b",
            "gemini-1.5-flash"
          ];

          for (let p of priority) {
            const matched = list.find(m => m.name.includes(p) && m.supportedGenerationMethods?.includes("generateContent"));
            if (matched) return matched.name; // returns 'models/gemini-...'
          }

          // Fallback to any model that supports generateContent excluding Pro (quota 0)
          const anyFlash = list.find(m => !m.name.includes("pro") && m.supportedGenerationMethods?.includes("generateContent"));
          if (anyFlash) return anyFlash.name;
        }
      } catch (e) {
        console.warn("Could not list models, falling back to gemini-2.0-flash");
      }
      return "models/gemini-2.0-flash";
    }

    async function callGemini(question, contextText) {
      const modelPath = await resolveActiveFlashModel();
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/${modelPath}:generateContent?key=${apiKey}`;

      const systemPrompt = `You are a Study Buddy AI assistant for students.
You handle two types of inputs:
1. Normal academic or conversational questions.
2. PDF-based questions (when context is provided).

TASK DETECTION RULES:
- If user asks for quiz, mcq, test, or practice questions -> type = "quiz"
- If user asks to explain, what is, why, or how -> type = "explanation"
- If user asks for summary or key takeaways -> type = "summary"
- Otherwise -> type = "normal"

OUTPUT FORMAT: Return strictly valid JSON with no markdown wrapping and no text outside:
{
  "type": "quiz" | "explanation" | "summary" | "normal",
  "response": "string",
  "quiz": [
    {
      "question": "string",
      "options": ["A: text", "B: text", "C: text", "D: text"],
      "answer": "A"
    }
  ],
  "short_notes": ["bullet point 1", "bullet point 2"]
}

If type is NOT quiz, keep quiz as [].
If type is NOT explanation or summary, keep short_notes as [].`;

      const userContent = `PDF CONTEXT:
${contextText && contextText.trim().length > 0 ? contextText : "No PDF uploaded. Answer using general knowledge."}

USER QUERY:
${question}`;

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: systemPrompt }]
          },
          contents: [{ parts: [{ text: userContent }] }],
          generationConfig: {
            responseMimeType: "application/json",
            temperature: 0.3
          }
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `HTTP ${res.status}: Failed to reach Gemini API`);
      }

      const raw = await res.json();
      const rawText = raw.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!rawText) {
        throw new Error("Empty response received from Gemini.");
      }

      try {
        return JSON.parse(rawText);
      } catch (e) {
        return {
          type: "normal",
          response: rawText,
          quiz: [],
          short_notes: []
        };
      }
    }

    function renderResponse(elemId, data) {
      const el = document.getElementById(elemId);
      if (!el) return;
      let html = "";

      if (data.response) {
        html += `<div class="mb-3 whitespace-pre-wrap">${data.response}</div>`;
      }

      if (data.short_notes && data.short_notes.length > 0) {
        html += `<div class="mt-3 p-3 bg-slate-950/60 rounded-xl border border-slate-800/80">
          <p class="font-semibold text-xs text-indigo-400 mb-2">📌 Key Takeaways:</p>
          <ul class="list-disc list-inside space-y-1 text-xs text-slate-300">
            ${data.short_notes.map(n => `<li>${n}</li>`).join('')}
          </ul>
        </div>`;
      }

      if (data.quiz && data.quiz.length > 0) {
        html += `<div class="mt-4 space-y-3">
          <p class="font-semibold text-xs text-indigo-400">📝 Practice Quiz:</p>`;
        data.quiz.forEach((q, idx) => {
          html += `
            <div class="p-3 bg-slate-950/70 border border-slate-800 rounded-xl text-xs">
              <p class="font-medium text-slate-100 mb-2">${idx + 1}. ${q.question}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 mb-2">
                ${q.options.map(opt => `<div class="p-2 bg-slate-900 border border-slate-800/60 rounded-lg text-slate-300">${opt}</div>`).join('')}
              </div>
              <details class="cursor-pointer text-[11px] text-emerald-400">
                <summary class="font-semibold select-none">Show Answer</summary>
                <div class="mt-1 text-slate-200">Correct Answer: <b>${q.answer}</b></div>
              </details>
            </div>`;
        });
        html += `</div>`;
      }

      el.innerHTML = html;
    }
  </script>
</body>
</html>
